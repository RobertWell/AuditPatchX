quarkus:
  oidc:
    auth-server-url: ${KEYCLOAK_URL:https://keycloak.local.test}/realms/${KEYCLOAK_REALM:auditpatchx}
    client-id: ${KEYCLOAK_CLIENT_ID:auditpatchx-app}
    credentials:
      secret: ${KEYCLOAK_CLIENT_SECRET:auditpatchx-secret}
    application-type: web-app
    logout:
      path: /api/auth/logout
      post-logout-path: /
  datasource:
    db-kind: oracle
    jdbc:
      url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  http:
    port: ${PORT:8080}
    cors:
      ~: true
      origins: "*"
      methods: "GET,POST,PUT,DELETE,OPTIONS"
      headers: "*"
  log:
    # Valid levels: OFF, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL
    # (Do not set to `false` — it will crash startup because it's not a log level.)
    level: ${LOG_LEVEL:INFO}
    console:
      enable: ${LOG_CONSOLE_ENABLE:true}
      json: false
      format: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n"

# Table allowlist configuration
allowlist:
  tables:
    - schema: TRDMGMR
      table: AGENT_MGMT
      pk-columns:
        - AGENT_ID
    - schema: TRDMGMR
      table: TRANSACTIONS
      pk-columns:
        - TRANSACTION_ID
    - schema: TRDMGMR
      table: RECONCILE_LOG
      pk-columns:
        - LOG_ID
    - schema: TRDMGMR
      table: RECON_MULTI_PK
      pk-columns:
        - BATCH_ID
        - REGION_CODE
        - EFFECTIVE_TS
    - schema: TRDMGMR_UAT
      table: TRANSACTIONS
      pk-columns:
        - TRANSACTION_ID
    - schema: TRDMGMR_UAT
      table: RECONCILE_LOG
      pk-columns:
        - LOG_ID
    - schema: TRDMGMR_UAT
      table: RECON_MULTI_PK
      pk-columns:
        - BATCH_ID
        - REGION_CODE
        - EFFECTIVE_TS
    # - schema: HR
    #   table: JOB_HISTORY
    #   pk-columns:
    #     - EMPLOYEE_ID
    #     - START_DATE

auth:
  mode: ${AUTH_MODE:oidc}

ui:
  readonly:
    # Global readonly columns to protect from patch update.
    columns: UPDATED_AT,UPDATED_BY,CREATED_AT,CREATED_BY
  diff-policy:
    # Optional column list ignored for row comparison in frontend diff workflow.
    exclude-columns: []
    # Optional strict include list. Keep empty to include all non-excluded fields.
    include-columns: []

sync-tables:
  pairs:
    - pair-name: Sync Prod and UAT
      db: ORACLE_MAIN
      tables:
        table-a: TRDMGMR.TRANSACTIONS
        table-b: TRDMGMR_UAT.TRANSACTIONS
      pk-columns:
        - TRANSACTION_ID
      # Optional list ignored for row comparison when deciding identical rows.
      exclude-columns:
        - UPDATED_BY
        - UPDATED_AT
    - pair-name: Reconcile Log Prod and UAT
      db: ORACLE_MAIN
      tables:
        table-a: TRDMGMR.RECONCILE_LOG
        table-b: TRDMGMR_UAT.RECONCILE_LOG
      pk-columns:
        - LOG_ID
      exclude-columns:
        - UPDATED_BY
        - UPDATED_AT
    - pair-name: Multi PK Reconcile Prod and UAT
      db: ORACLE_MAIN
      tables:
        table-a: TRDMGMR.RECON_MULTI_PK
        table-b: TRDMGMR_UAT.RECON_MULTI_PK
      pk-columns:
        - BATCH_ID
        - REGION_CODE
        - EFFECTIVE_TS
      exclude-columns:
        - UPDATED_BY
        - UPDATED_AT
