quarkus:
  # External config overlay for ArgoCD:
  # Set env var QUARKUS_CONFIG_LOCATIONS=/app/config/application.yaml
  # to inject a mounted ConfigMap with env-specific allowlist + sync-tables.
  # No value is needed here — set it via the Kubernetes deployment env block.

  datasource:
    db-kind: oracle
    jdbc:
      url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  http:
    port: ${PORT:8080}
    cors:
      ~: true
      origins: "*"
      methods: "GET,POST,PUT,DELETE,OPTIONS"
      headers: "*"
  log:
    level: ${LOG_LEVEL:INFO}
    console:
      enable: ${LOG_CONSOLE_ENABLE:true}
      json: ${LOG_JSON:false}
      format: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n"

# Table allowlist — override via CONFIG_LOCATIONS in production.
# Provide a minimal valid default for local dev (adjust to your schema).
allowlist:
  tables:
    - schema: TRDMGMR
      table: AGENT_MGMT
      pk-columns:
        - AGENT_ID
    - schema: TRDMGMR
      table: TRANSACTIONS
      pk-columns:
        - TRANSACTION_ID

ui:
  readonly:
    columns: UPDATED_AT,UPDATED_BY,CREATED_AT,CREATED_BY
  diff-policy:
    exclude-columns: []
    include-columns: []

# Sync pairs — override via CONFIG_LOCATIONS in production.
sync-tables:
  pairs: []
