quarkus:
  datasource:
    db-kind: oracle
    jdbc:
      url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  http:
    port: ${PORT:8080}
    cors:
      ~: true
      origins: "*"
      methods: "GET,POST,PUT,DELETE,OPTIONS"
      headers: "*"
  log:
    # Valid levels: OFF, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL
    # (Do not set to `false` — it will crash startup because it's not a log level.)
    level: ${LOG_LEVEL:INFO}
    console:
      enable: ${LOG_CONSOLE_ENABLE:true}
      json: false
      format: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n"

# Table allowlist configuration
allowlist:
  tables:
    - schema: TRDMGMR
      table: AGENT_MGMT
      pk-columns:
        - AGENT_ID
    - schema: TRDMGMR
      table: TRANSACTIONS
      pk-columns:
        - TRANSACTION_ID
    # - schema: HR
    #   table: JOB_HISTORY
    #   pk-columns:
    #     - EMPLOYEE_ID
    #     - START_DATE

ui:
  readonly:
    # Global readonly columns to protect from patch update.
    columns: UPDATED_AT,UPDATED_BY,CREATED_AT,CREATED_BY
  diff-policy:
    # Optional column list ignored for row comparison in frontend diff workflow.
    exclude-columns:
    # Optional strict include list. Keep empty to include all non-excluded fields.
    include-columns:

sync-tables:
  pairs:
    - pair-name: Sync Prod and UAT
      db: ORACLE_MAIN
      tables:
        table-a: TRDMGMR.TRANSACTIONS
        table-b: TRDMGMR.TRANSACTIONS_UAT
      pk-columns:
        - TRANSACTION_ID
      # Optional list ignored for row comparison when deciding identical rows.
      exclude-columns:
        - UPDATED_BY
        - UPDATED_AT
