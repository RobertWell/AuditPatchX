# sync-tables.pairs is intentionally absent from this YAML.
# SRCFG00050 fires when YAML list entries can't be matched to a ConfigMapping
# root in a fresh CI build. Absent key → SyncTableConfig.pairs() returns [].
# testGetCompareConfig is updated to handle the empty-list case.
