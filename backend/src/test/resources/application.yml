quarkus:
  datasource:
    db-kind: oracle
    jdbc:
      url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:XEPDB1}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test}
  http:
    port: 8081
    test-port: 0
  log:
    level: INFO
    category:
      "com.auditpatchx":
        level: DEBUG
      "org.testcontainers":
        level: INFO

# Test table allowlist configuration
allowlist:
  tables:
    - schema: TESTUSER
      table: EMPLOYEE
      pk-columns:
        - EMP_ID
    - schema: TESTUSER
      table: DEPARTMENT
      pk-columns:
        - DEPT_ID
    - schema: TESTUSER
      table: JOB_HISTORY
      pk-columns:
        - EMPLOYEE_ID
        - START_DATE
    - schema: TESTUSER
      table: COMPARE_SOURCE
      pk-columns:
        - ID
    - schema: TESTUSER
      table: COMPARE_TARGET
      pk-columns:
        - ID
    - schema: TESTUSER
      table: ALLTYPE_SOURCE
      pk-columns:
        - ID
    - schema: TESTUSER
      table: ALLTYPE_TARGET
      pk-columns:
        - ID

sync-tables:
  pairs:
    - pair-name: Employee Self Compare
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.EMPLOYEE
        table-b: TESTUSER.EMPLOYEE
      pk-columns:
        - EMP_ID
      exclude-columns:
        - MANAGER_ID
    - pair-name: Compare Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.COMPARE_SOURCE
        table-b: TESTUSER.COMPARE_TARGET
      pk-columns:
        - ID
      exclude-columns:
        - UPDATED_BY
    - pair-name: AllType Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.ALLTYPE_SOURCE
        table-b: TESTUSER.ALLTYPE_TARGET
      pk-columns:
        - ID
      exclude-columns: []
