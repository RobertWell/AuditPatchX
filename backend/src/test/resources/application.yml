quarkus:
  datasource:
    db-kind: oracle
    jdbc:
      url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:XEPDB1}
      # HEL-130: expose Agroal pool metrics (activeCount etc.) so the
      # lifecycle tests can assert leases return to 0 after service ops.
      # HEL-227: Quarkus 3.38 moved this off DataSourceJdbcRuntimeConfig
      # (`enable-metrics`) onto build-time DataSourceJdbcBuildTimeConfig
      # (`metrics.enabled`). The old key still RESOLVES as plain config, so it
      # fails silently: metricsEnabled()=false and every counter reads 0, which
      # made PoolOwnershipTests' anti-vacuous acquireCount>0 guard trip.
      metrics:
        enabled: true
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test}
  http:
    port: 8081
    test-port: 0
  test:
    # Oracle Free image pull + startup can take 15+ min on cold CI cache
    hang-detection-timeout: PT30M
  log:
    level: INFO
    category:
      "com.auditpatchx":
        level: DEBUG
      "org.testcontainers":
        level: INFO

# Test table allowlist configuration
allowlist:
  tables:
