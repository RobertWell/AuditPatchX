quarkus:
  datasource:
    db-kind: oracle
    jdbc:
      url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:XEPDB1}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test}
  http:
    port: 8081
    test-port: 0
  test:
    # Oracle Free image pull + startup can take 15+ min on cold CI cache
    hang-detection-timeout: PT30M
  log:
    level: INFO
    category:
      "com.auditpatchx":
        level: DEBUG
      "org.testcontainers":
        level: INFO

# Test table allowlist configuration
allowlist:
  tables:
    - schema: TESTUSER
      table: EMPLOYEE
      pk-columns:
        - EMP_ID
    - schema: TESTUSER
      table: DEPARTMENT
      pk-columns:
        - DEPT_ID
    - schema: TESTUSER
      table: JOB_HISTORY
      pk-columns:
        - EMPLOYEE_ID
        - START_DATE
    - schema: TESTUSER
      table: COMPARE_SOURCE
      pk-columns:
        - ID
    - schema: TESTUSER
      table: COMPARE_TARGET
      pk-columns:
        - ID
    - schema: TESTUSER
      table: ALLTYPE_SOURCE
      pk-columns:
        - ID
    - schema: TESTUSER
      table: ALLTYPE_TARGET
      pk-columns:
        - ID
    - schema: TESTUSER
      table: DIRECTION_A
      pk-columns:
        - ID
    - schema: TESTUSER
      table: DIRECTION_B
      pk-columns:
        - ID
    - schema: TESTUSER
      table: COMPOSITE_SOURCE
      pk-columns:
        - REGION_ID
        - DEPT_CODE
    - schema: TESTUSER
      table: COMPOSITE_TARGET
      pk-columns:
        - REGION_ID
        - DEPT_CODE
    - schema: TESTUSER
      table: TSPK_SOURCE
      pk-columns:
        - EVENT_ID
        - EVENT_TS
    - schema: TESTUSER
      table: TSPK_TARGET
      pk-columns:
        - EVENT_ID
        - EVENT_TS
    - schema: TESTUSER
      table: TZPK_SOURCE
      pk-columns:
        - EVENT_ID
        - EVENT_TS
    - schema: TESTUSER
      table: TZPK_TARGET
      pk-columns:
        - EVENT_ID
        - EVENT_TS

sync-tables:
  pairs:
    - pair-name: Employee Self Compare
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.EMPLOYEE
        table-b: TESTUSER.EMPLOYEE
      pk-columns:
        - EMP_ID
      exclude-columns:
        - MANAGER_ID
    - pair-name: Compare Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.COMPARE_SOURCE
        table-b: TESTUSER.COMPARE_TARGET
      pk-columns:
        - ID
      exclude-columns:
        - UPDATED_BY
    - pair-name: AllType Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.ALLTYPE_SOURCE
        table-b: TESTUSER.ALLTYPE_TARGET
      pk-columns:
        - ID
      exclude-columns: []
    - pair-name: Composite Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.COMPOSITE_SOURCE
        table-b: TESTUSER.COMPOSITE_TARGET
      pk-columns:
        - REGION_ID
        - DEPT_CODE
      exclude-columns: []
    - pair-name: TimestampPK Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.TSPK_SOURCE
        table-b: TESTUSER.TSPK_TARGET
      pk-columns:
        - EVENT_ID
        - EVENT_TS
      exclude-columns: []
    - pair-name: TimezoneTimestampPK Source Target
      db: TEST_ORACLE
      tables:
        table-a: TESTUSER.TZPK_SOURCE
        table-b: TESTUSER.TZPK_TARGET
      pk-columns:
        - EVENT_ID
        - EVENT_TS
      exclude-columns: []
