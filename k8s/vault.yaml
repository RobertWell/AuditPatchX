---
# VaultConnection: WHERE Vault is. HEL-473 — this object was missing for 87 days, so the VaultAuth
# below (which references it by the name `default`) could never resolve, and the operator logged
# `VaultConnection "default" not found` roughly 14 times a minute while this app's Secret was in
# fact hand-created and never synced from Vault at all. Verified safe to enable on 2026-09-08:
# secret/auditpatchx holds exactly db-url / db-user / db-password and all three values hash
# identically to the live Secret, so the sync (destination.overwrite: true) is a no-op on content.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: auditpatchx
spec:
  # HTTPS since 2026-09-12. Vault used to run `tls_disable = 1` on both clusters, which is why this
  # said http:// when it was written; HEL-474 (prod) and HEL-502 (LAN) gave Vault a serving
  # certificate on 8300 behind the Service `vault-tls`, and plaintext 8200 is now bound to loopback —
  # so the old address no longer connects at all. The CA is a per-namespace Secret (Secrets are
  # namespace-local, so `vault-ca` has to exist in EVERY consuming namespace) holding the public
  # cert only. skipTLSVerify stays false: a bad certificate must fail closed.
  #
  # THE LIVE OBJECT IS OWNED BY ARGOCD, NOT BY THIS FILE — application `vault-clients` in hello-sre
  # (`hello-vault/apps/vault-clients/manifests/auditpatchx-vaultconnection-default.yaml`) syncs it
  # with selfHeal. This copy exists so a fresh cluster can be bootstrapped from this repo; keep the
  # two in step, and change the hello-sre one if you want the live object to move.
  address: https://vault-tls.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
  skipTLSVerify: false
---
# VaultAuth: tells the Vault Secrets Operator how to authenticate
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: auditpatchx-vault-auth
  namespace: auditpatchx
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: auditpatchx
    serviceAccount: auditpatchx
  vaultConnectionRef: default
---
# VaultStaticSecret: syncs secret/auditpatchx from Vault → k8s Secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: auditpatchx-vault-secret
  namespace: auditpatchx
spec:
  type: kv-v2
  mount: secret
  path: auditpatchx
  destination:
    name: auditpatchx-secret
    create: true
    overwrite: true
  refreshAfter: 30s
  vaultAuthRef: auditpatchx-vault-auth
