---
# VaultConnection: WHERE Vault is. HEL-473 — this object was missing for 87 days, so the VaultAuth
# below (which references it by the name `default`) could never resolve, and the operator logged
# `VaultConnection "default" not found` roughly 14 times a minute while this app's Secret was in
# fact hand-created and never synced from Vault at all. Verified safe to enable on 2026-09-08:
# secret/auditpatchx holds exactly db-url / db-user / db-password and all three values hash
# identically to the live Secret, so the sync (destination.overwrite: true) is a no-op on content.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: auditpatchx
spec:
  # http, not https, and that is not an oversight — see HEL-474. Vault's own listener is
  # `tls_disable = 1` on BOTH clusters, so there is no TLS endpoint to address; 8201 is the HA
  # cluster port, not a client API. Pointing this at https:// would fail to connect, not harden
  # anything. All seven VaultConnections in the estate share this address, the oldest from
  # 2026-01-14. The real fix is giving Vault a serving certificate and flipping every connection
  # together, which is tracked in HEL-474. skipTLSVerify stays false so that when TLS does arrive,
  # a bad certificate fails closed instead of silently downgrading.
  address: http://vault.vault:8200
  skipTLSVerify: false
---
# VaultAuth: tells the Vault Secrets Operator how to authenticate
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: auditpatchx-vault-auth
  namespace: auditpatchx
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: auditpatchx
    serviceAccount: auditpatchx
  vaultConnectionRef: default
---
# VaultStaticSecret: syncs secret/auditpatchx from Vault → k8s Secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: auditpatchx-vault-secret
  namespace: auditpatchx
spec:
  type: kv-v2
  mount: secret
  path: auditpatchx
  destination:
    name: auditpatchx-secret
    create: true
    overwrite: true
  refreshAfter: 30s
  vaultAuthRef: auditpatchx-vault-auth
