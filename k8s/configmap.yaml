apiVersion: v1
kind: ConfigMap
metadata:
  name: auditpatchx-config
  namespace: auditpatchx
data:
  # Mounted at /app/config/application.yaml via QUARKUS_CONFIG_LOCATIONS.
  # Add production tables and sync pairs here without rebuilding the image.
  application.yaml: |
    allowlist:
      tables:
        - schema: TRDMGMR
          table: AGENT_MGMT
          pk-columns:
            - AGENT_ID
        - schema: TRDMGMR
          table: TRANSACTIONS
          pk-columns:
            - TRANSACTION_ID
        - schema: TRDMGMR
          table: RECONCILE_LOG
          pk-columns:
            - LOG_ID
        - schema: TRDMGMR
          table: RECON_MULTI_PK
          pk-columns:
            - BATCH_ID
            - REGION_CODE
            - EFFECTIVE_TS
        - schema: TRDMGMR_UAT
          table: TRANSACTIONS
          pk-columns:
            - TRANSACTION_ID
        - schema: TRDMGMR_UAT
          table: RECONCILE_LOG
          pk-columns:
            - LOG_ID
        - schema: TRDMGMR_UAT
          table: RECON_MULTI_PK
          pk-columns:
            - BATCH_ID
            - REGION_CODE
            - EFFECTIVE_TS
