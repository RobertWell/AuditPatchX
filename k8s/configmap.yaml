apiVersion: v1
kind: ConfigMap
metadata:
  name: auditpatchx-config
  namespace: auditpatchx
data:
  # Mounted at /app/config/application.yaml via QUARKUS_CONFIG_LOCATIONS.
  # Add production tables and sync pairs here without rebuilding the image.
  application.yaml: |
    allowlist:
      tables:
        - schema: TRDMGMR
          table: AGENT_MGMT
          pk-columns:
            - AGENT_ID
        - schema: TRDMGMR
          table: TRANSACTIONS
          pk-columns:
            - TRANSACTION_ID
        - schema: TRDMGMR
          table: RECONCILE_LOG
          pk-columns:
            - LOG_ID
        - schema: TRDMGMR
          table: RECON_MULTI_PK
          pk-columns:
            - BATCH_ID
            - REGION_CODE
            - EFFECTIVE_TS
        - schema: TRDMGMR_UAT
          table: TRANSACTIONS
          pk-columns:
            - TRANSACTION_ID
        - schema: TRDMGMR_UAT
          table: RECONCILE_LOG
          pk-columns:
            - LOG_ID
        - schema: TRDMGMR_UAT
          table: RECON_MULTI_PK
          pk-columns:
            - BATCH_ID
            - REGION_CODE
            - EFFECTIVE_TS

    # 408 comparison pairs: 51 TRDMGMR tables × 8 environment directions.
    # Validation is lazy — pairs pointing to non-existent schemas return null
    # validation and are still selectable in the UI.
    sync-tables:
      pairs:
        - pair-name: "AGENT_ACTION_RECORDS [prod → uat]"
          db: "oracle-k8s / prod → uat"
          tables:
            table-a: "TRDMGMR.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_UAT.AGENT_ACTION_RECORDS"
          pk-columns:
            - HISTDATE
            - AGENT_ID
            - ACTION_NUM
        - pair-name: "AGENT_ACTION_RECORDS [prod → staging]"
          db: "oracle-k8s / prod → staging"
          tables:
            table-a: "TRDMGMR.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_STAGING.AGENT_ACTION_RECORDS"
          pk-columns:
            - HISTDATE
            - AGENT_ID
            - ACTION_NUM
        - pair-name: "AGENT_ACTION_RECORDS [prod → dr]"
          db: "oracle-k8s / prod → dr"
          tables:
            table-a: "TRDMGMR.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_DR.AGENT_ACTION_RECORDS"
          pk-columns:
            - HISTDATE
            - AGENT_ID
            - ACTION_NUM
        - pair-name: "AGENT_ACTION_RECORDS [prod → hotfix]"
          db: "oracle-k8s / prod → hotfix"
          tables:
            table-a: "TRDMGMR.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_HOTFIX.AGENT_ACTION_RECORDS"
          pk-columns:
            - HISTDATE
            - AGENT_ID
            - ACTION_NUM
        - pair-name: "AGENT_ACTION_RECORDS [uat → staging]"
          db: "oracle-k8s / uat → staging"
          tables:
            table-a: "TRDMGMR_UAT.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_STAGING.AGENT_ACTION_RECORDS"
          pk-columns:
            - HISTDATE
            - AGENT_ID
            - ACTION_NUM
        - pair-name: "AGENT_ACTION_RECORDS [uat → dr]"
          db: "oracle-k8s / uat → dr"
          tables:
            table-a: "TRDMGMR_UAT.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_DR.AGENT_ACTION_RECORDS"
          pk-columns:
            - HISTDATE
            - AGENT_ID
            - ACTION_NUM
        - pair-name: "AGENT_ACTION_RECORDS [staging → dr]"
          db: "oracle-k8s / staging → dr"
          tables:
            table-a: "TRDMGMR_STAGING.AGENT_ACTION_RECORDS"
            table-b: "TRDMGMR_DR.AGENT_ACTION_RECORDS"
