default:
  interruptible: true

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: roguerzzz123/auditpatchx

stages:
  - test
  - build
  - deploy

# ── Backend tests (Oracle Free testcontainer) ────────────────────────────────
backend-tests:
  stage: test
  tags:
    - privileged
  retry:
    max: 2
    when: script_failure
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: docker:24-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  before_script:
    # HEL-189: PkgroveKit >=0.3.0 (com.pkgrove) resolves from PUBLIC Maven
    # Central — no registry URL, no http-blocker exemption (ci_settings.xml
    # now only re-asserts the standard full blocker).
    - cd backend
    - find $CI_PROJECT_DIR/.m2 -name "*.lastUpdated" -delete 2>/dev/null || true
  script:
    # quarkus-jacoco is on by default once the extension is present (a raw
    # jacoco agent under-reports @QuarkusTest, see backend/pom.xml HEL-174);
    # the flag makes the gate's precondition explicit on the command line.
    - mvn test -B -s $CI_PROJECT_DIR/ci_settings.xml -Dquarkus.jacoco.enabled=true
    # Backend line-coverage gate: >= 90% over the whole main source set,
    # computed from quarkus-jacoco's CSV (columns 8/9 = LINE_MISSED /
    # LINE_COVERED). The "lines NN.N%" line feeds the `coverage:` regex below.
    - |
      csv=target/jacoco-report/jacoco.csv
      if [ ! -f "$csv" ]; then
        echo "coverage gate: $csv is missing - quarkus-jacoco produced no report"
        exit 1
      fi
      awk -F, -v min=90 '
        NR > 1 { missed += $8; covered += $9 }
        END {
          total = missed + covered
          if (total == 0) { print "coverage gate: no lines analysed"; exit 1 }
          pct = 100 * covered / total
          printf "lines %.1f%% (%d/%d) - minimum %d%%\n", pct, covered, total, min
          if (pct < min) { print "coverage gate: FAILED"; exit 1 }
          print "coverage gate: passed"
        }' "$csv"
  coverage: '/lines\s+([\d.]+)%/'
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
      - backend/target/jacoco-report/
    expire_in: 7 days
  timeout: 40 minutes

# ── Frontend build + tests ────────────────────────────────────────────────────
# vite outDir is ../backend/src/main/resources/META-INF/resources so the
# built static files land directly in Quarkus's static resource path.
frontend-tests:
  stage: test
  image: node:20-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci
  script:
    # HEL-179: run the suite WITH coverage so the gate is CI-enforced, not local.
    - npm run test:coverage
    - npm run build
  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    paths:
      - backend/src/main/resources/META-INF/resources/
      - frontend/coverage/coverage-summary.json
      - frontend/coverage/lcov.info
    expire_in: 1 day
  timeout: 10 minutes

# ── Dependency scan (HEL-860 item 7) ──────────────────────────────────────────
# trivy over backend/pom.xml and frontend/package-lock.json, judged by hello-sre's shared CVE policy (fixable
# CRITICAL/HIGH block; unfixed are reported). Exit 2 = the scan could not run: never a pass. Same job shape as
# mobile-app's: the backend tree is resolved into the repo-local .m2 first and scanned --offline-scan, because a
# scan that resolves against Maven Central at job time is inconclusive whenever Central answers 429.
dep-scan:
  resource_group: lan-heavy-io   # one heavy-I/O job at a time (HEL-665)
  stage: test
  image: maven:3.9-eclipse-temurin-21
  timeout: 45 minutes            # trivy binary + DBs ~140 MB on the runner link
  variables:
    GIT_DEPTH: "1"
    # The scanner runs in THIS pipeline with its job token: pinned to a hello-sre commit and verified after the
    # fetch, never a moving branch (HEL-507). Same pin as mobile-app and hello-stock; bump deliberately.
    HELLO_SRE_REF: "f40ed27357effa10aaa05eab0ace189d18604b51"
  cache:
    - key: maven-$CI_COMMIT_REF_SLUG
      paths:
        - .m2/repository/
      policy: pull-push
    - key: trivy-db
      paths:
        - .trivycache/
  script:
    - |
      set -e
      command -v git >/dev/null && command -v curl >/dev/null || { apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends git curl >/dev/null; }
      rm -rf hello-sre && git init -q hello-sre && cd hello-sre
      # the job token reaches git through a credential helper from the environment, never on argv
      git -c credential.helper='!f() { echo username=gitlab-ci-token; echo "password=$CI_JOB_TOKEN"; }; f' fetch -q --depth 1 http://gitlab.gitlab.svc.cluster.local/root/hello-sre.git "$HELLO_SRE_REF"
      git checkout -q FETCH_HEAD; [ "$(git rev-parse HEAD)" = "$HELLO_SRE_REF" ] || { echo "ERROR: hello-sre did not resolve to the pinned $HELLO_SRE_REF"; exit 2; }
      cd "$CI_PROJECT_DIR"
      mvn -B -ntp -s "$CI_PROJECT_DIR/ci_settings.xml" -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" -f backend/pom.xml dependency:go-offline -DincludeScope=test > mvn-resolve.log 2>&1 \
        || mvn -B -ntp -s "$CI_PROJECT_DIR/ci_settings.xml" -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" -f backend/pom.xml dependency:resolve > mvn-resolve.log 2>&1 \
        || { echo "ERROR: could not resolve backend/pom.xml - the scan would be INCONCLUSIVE:"; tail -30 mvn-resolve.log; exit 2; }
      HOME="$CI_PROJECT_DIR" TARGET="$CI_PROJECT_DIR" NAME=AuditPatchX DEP_SCAN_EXTRA="--offline-scan --skip-dirs hello-sre" CVE_OUT_DIR="$CI_PROJECT_DIR/cve" sh hello-sre/scripts/ci/dep-scan.sh
  artifacts:
    when: always
    paths:
      - cve/
    expire_in: 90 days

# ── Docker image build & push ─────────────────────────────────────────────────
build-image:
  stage: build
  tags:
    - privileged
  image: docker:24
  # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are scoped to this environment (GitLab CI variable
  # environment_scope=dockerhub, set 2026-10-26, HEL-718 review): only jobs that declare it
  # receive them, so every other job and its service containers never see the push token.
  # `action: prepare` records no deployment.
  environment:
    name: dockerhub
    action: prepare
  services:
    - name: docker:24-dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - backend-tests
    - frontend-tests
    - dep-scan        # HEL-860: an image with a fixable CRITICAL/HIGH dependency is never built
  before_script:
    - |
      for i in $(seq 1 60); do
        docker info >/dev/null 2>&1 && echo "Docker ready after ${i}s" && break
        sleep 2
      done
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    # HEL-189: the in-image maven build resolves PkgroveKit from public Maven
    # Central — no build-arg, no in-cluster registry dependency.
    - docker build
        -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
  timeout: 20 minutes

# ── Auto-deploy to k8s (auditpatchx namespace) ───────────────────────────────
# Runs only on main after build-image succeeds.
# Uses in-cluster ServiceAccount (gitlab-runner SA → gitlab-runner-deployer
# Role in auditpatchx ns) — no kubeconfig or credentials required.
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  needs:
    - job: build-image
  before_script:
    - kubectl version --client
  script:
    - kubectl rollout restart deployment/auditpatchx -n auditpatchx
    - kubectl rollout status deployment/auditpatchx -n auditpatchx --timeout=300s
  only:
    - main
  timeout: 10 minutes

# HEL-841: no credential reaches main. The tree and the full history of HEAD go through gitleaks (8.24.3, by digest);
# a shallow clone fails closed. Known findings would be exact fingerprints in .gitleaksignore (none on 11-12).
secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
    entrypoint: [""]
  timeout: 10 minutes
  interruptible: false   # a cancelled pipeline must not mean an unscanned push
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"       # the full history is scanned; a shallow clone fails the job
  script:
    - sh scripts/ci/secret-scan.sh
  artifacts:
    when: always
    paths: [gitleaks-report.json, commits-gitleaks-report.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
