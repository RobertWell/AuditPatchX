default:
  interruptible: true

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: roguerzzz123/auditpatchx

stages:
  - test
  - build
  - deploy

# ── Backend tests (Oracle Free testcontainer) ────────────────────────────────
backend-tests:
  stage: test
  tags:
    - privileged
  retry:
    max: 2
    when: script_failure
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: docker:24-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  before_script:
    # HEL-123: RowRelay resolves from the LAN GitLab Maven registry
    # (root/rowrelay, public => anonymous reads, no PAT) as a NORMAL Maven
    # dependency — the from-source provisioning is retired. Job pods cannot
    # resolve the edge hostname, so the URL is the in-cluster service DNS;
    # ci_settings.xml disables Maven's default http blocker for this hop
    # (accepted in-cluster tradeoff, documented there).
    - cd backend
    - find $CI_PROJECT_DIR/.m2 -name "*.lastUpdated" -delete 2>/dev/null || true
  script:
    - mvn test -B -s $CI_PROJECT_DIR/ci_settings.xml
        -Drowrelay.repo.url=http://gitlab.gitlab.svc.cluster.local/api/v4/projects/5/packages/maven
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days
  timeout: 40 minutes

# ── Frontend build + tests ────────────────────────────────────────────────────
# vite outDir is ../backend/src/main/resources/META-INF/resources so the
# built static files land directly in Quarkus's static resource path.
frontend-tests:
  stage: test
  image: node:20-alpine
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx vitest run
    - npm run build
  artifacts:
    paths:
      - backend/src/main/resources/META-INF/resources/
    expire_in: 1 day
  timeout: 10 minutes

# ── Docker image build & push ─────────────────────────────────────────────────
build-image:
  stage: build
  tags:
    - privileged
  image: docker:24
  services:
    - name: docker:24-dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - backend-tests
    - frontend-tests
  before_script:
    - |
      for i in $(seq 1 60); do
        docker info >/dev/null 2>&1 && echo "Docker ready after ${i}s" && break
        sleep 2
      done
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    # HEL-123: the in-image maven build resolves RowRelay from the in-cluster
    # registry (dind build containers inherit the pod's DNS).
    - docker build
        --build-arg ROWRELAY_REPO_URL=http://gitlab.gitlab.svc.cluster.local/api/v4/projects/5/packages/maven
        -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
  timeout: 20 minutes

# ── Auto-deploy to k8s (auditpatchx namespace) ───────────────────────────────
# Runs only on main after build-image succeeds.
# Uses in-cluster ServiceAccount (gitlab-runner SA → gitlab-runner-deployer
# Role in auditpatchx ns) — no kubeconfig or credentials required.
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  needs:
    - job: build-image
  before_script:
    - kubectl version --client
  script:
    - kubectl rollout restart deployment/auditpatchx -n auditpatchx
    - kubectl rollout status deployment/auditpatchx -n auditpatchx --timeout=300s
  only:
    - main
  timeout: 10 minutes
